name: .NET CI - Build & Test

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o SDK do .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Restaurar Dependências (NuGet)
      run: dotnet restore Resenha.sln

    - name: Compilar Solução (Build)
      run: dotnet build Resenha.sln --no-restore --configuration Release

    - name: Executar Testes Unitários
      run: dotnet test Resenha.sln --no-build --configuration Release --verbosity normal